recipe:
  name: STK Official (git) SUPEROPTIMIZED!
  stk-version: 1

assets:
  type: standard
  # url: none
  # updatable: no

code:
  type: git
  url: standard
  release: none
  commit: none
  branch: none
  patch: none
  updatable: yes
  cmake_options: -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_FLAGS_RELWITHDEBINFO="-O3 -DNDEBUG -march=native" -DCMAKE_CXX_FLAGS_RELWITHDEBINFO="-O3 -DNDEBUG -march=native" -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON -DOpenGL_GL_PREFERENCE=GLVND -DBUILD_RECORDER=OFF -DENABLE_VULKAN=ON
